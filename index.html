<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>NM_AE Performance</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #050505; color: white; }
        .setup-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        #app-frame { width: 100%; height: 100%; border: none; display: none; }
    </style>
</head>
<body>

    <!-- Pantalla de control para TI (solo tú ves esto al iniciar) -->
    <div id="setup" class="setup-screen">
        <h1>NM_AE BRIDGE</h1>
        <p>Pega aquí el link del túnel (lhr.life):</p>
        <input type="text" id="linkInput" style="width: 300px; padding: 10px;">
        <br>
        <button onclick="cargarApp()" style="padding: 15px 30px; cursor: pointer;">INICIAR PERFORMANCE</button>
    </div>

    <!-- La ventana donde vivirá tu App -->
    <iframe id="app-frame"></iframe>

    <script>
        function cargarApp() {
            const link = document.getElementById('linkInput').value;
            if(!link) return;
            
            // Ocultamos el setup y mostramos la app en el iframe
            document.getElementById('setup').style.display = 'none';
            const frame = document.getElementById('app-frame');
            frame.src = link;
            frame.style.display = 'block';
        }
    </script>
</body>
</html>
