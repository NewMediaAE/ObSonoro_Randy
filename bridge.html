<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>NM_AE Performance</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #050505; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        .box { background: #111; padding: 2rem; border-radius: 20px; border: 1px solid #333; }
        h1 { color: #00ffcc; margin-bottom: 0.5rem; }
        input { width: 300px; padding: 10px; margin: 20px 0; border-radius: 5px; border: none; }
        button { background: #ff0055; color: white; border: none; padding: 15px 30px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        #qr-code { margin-top: 20px; background: white; padding: 10px; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>NM_AE BRIDGE</h1>
        <p>Pega aquí el nuevo link de Pinggy:</p>
        <input type="text" id="linkInput" placeholder="https://xxxx.pinggy.link">
        <br>
        <button onclick="generar()">GENERAR QR Y LINK</button>
        <div id="qr-code"></div>
        <a id="finalLink" href="#" style="display:block; margin-top:20px; color:#00ffcc;"></a>
    </div>

    <script>
        function generar() {
            const link = document.getElementById('linkInput').value;
            if(!link) return;
            // Generar QR
            QRCode.toCanvas(document.getElementById('qr-code'), link, {width: 200}, function (error) {
                if (error) console.error(error);
            });
            // Mostrar Link
            const a = document.getElementById('finalLink');
            a.href = link;
            a.innerText = "ENTRAR AHORA";
        }
    </script>
</body>
</html>
